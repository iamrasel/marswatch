<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MarsWatch</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="dark">

    <aside class="rail-left">

        <div class="rail-header">
            <div class="logo">MARS<br />WATCH</div>
            <button class="theme-btn" id="themeToggle" title="Switch theme">
                <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </div>

        <div class="rail-middle" id="railMiddle">

            <div class="normal-view" id="normalView">
                <div class="center-section">
                    <div class="total-block">
                        <div class="total-time" id="parent-time">00:00:00.00</div>
                        <div class="total-label">Total Achieved Hours</div>
                    </div>
                    <div class="action-wrapper">
                        <button class="rail-btn action-btn" id="action-btn" onclick="handleActionButton()">
                            <svg viewBox="0 -960 960 960" width="22" height="22">
                                <path id="action-icon-path" d="M560-200v-560h160v560H560Zm-320 0v-560h160v560H240Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="ot-block" id="ot-block">
                    <label class="switch">
                        <input type="checkbox" id="ot-checkbox" />
                        <span class="switch-track"></span>
                    </label>
                    <div class="ot-value" id="ot-value">OT</div>
                    <div class="ot-rate" id="ot-rate">250 ৳/Hr</div>
                </div>
            </div>

            <div class="marsLists-view" id="marsListsView">
                <div class="marsLists-spacer"></div>
                <div class="marsLists-buttons" id="marsListsBtns"></div>
            </div>

            <div class="escalate-view" id="escalateView">
                <div class="escalate-spacer"></div>
                <div class="escalate-buttons" id="escNotesBtns"></div>
            </div>

        </div>

        <div class="rail-footer">
            <span class="date-label" id="date-label"></span>
        </div>
    </aside>

    <main class="main">
        <div class="card-grid" id="cardGrid"></div>
    </main>

    <aside class="rail-right">
        <div class="rail-controls">
            <button class="rail-btn" id="marsLists" onclick="toggleView('lists')" title="Mars Lists">
                <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M15 3.604H1v1.891h14v-1.89ZM1 7.208V16l7-3.926L15 16V7.208zM15 0H1v1.89h14z"/>
                </svg>
            </button>
            <button class="rail-btn" id="escalateToggleBtn" onclick="toggleView('notes')" title="Escalate Notes">
                <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M12.17 9.53c2.307-2.592 3.278-4.684 3.641-6.218.21-.887.214-1.58.16-2.065a3.6 3.6 0 0 0-.108-.563 2 2 0 0 0-.078-.23V.453c-.073-.164-.168-.234-.352-.295a2 2 0 0 0-.16-.045 4 4 0 0 0-.57-.093c-.49-.044-1.19-.03-2.08.188-1.536.374-3.618 1.343-6.161 3.604l-2.4.238h-.006a2.55 2.55 0 0 0-1.524.734L.15 7.17a.512.512 0 0 0 .433.868l1.896-.271c.28-.04.592.013.955.132.232.076.437.16.655.248l.203.083c.196.816.66 1.58 1.275 2.195.613.614 1.376 1.08 2.191 1.277l.082.202c.089.218.173.424.249.657.118.363.172.676.132.956l-.271 1.9a.512.512 0 0 0 .867.433l2.382-2.386c.41-.41.668-.949.732-1.526zm.11-3.699c-.797.8-1.93.961-2.528.362-.598-.6-.436-1.733.361-2.532.798-.799 1.93-.96 2.528-.361s.437 1.732-.36 2.531Z"/>
                    <path d="M5.205 10.787a7.6 7.6 0 0 0 1.804 1.352c-1.118 1.007-4.929 2.028-5.054 1.903-.126-.127.737-4.189 1.839-5.18.346.69.837 1.35 1.411 1.925"/>
                </svg>
            </button>
            <div class="rail-divider"></div>
            <button class="rail-btn" onclick="copyData()" title="Copy Backup">
                <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.354 15.854a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 0-.708l1-1a.5.5 0 0 1 .708 0l.646.647V4H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9v7.793l.646-.647a.5.5 0 0 1 .708 0l1 1a.5.5 0 0 1 0 .708z"/>
                    <path d="M1 9a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4.5a.5.5 0 0 1 0 1H1v2h4.5a.5.5 0 0 1 0 1zm9.5 0a.5.5 0 0 1 0-1H15V6h-4.5a.5.5 0 0 1 0-1H15a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1z"/>
                </svg>
            </button>
            <button class="rail-btn" onclick="pasteData()" title="Paste Backup">
                <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8.354.146a.5.5 0 0 0-.708 0l-3 3a.5.5 0 0 0 0 .708l1 1a.5.5 0 0 0 .708 0L7 4.207V12H1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H9V4.207l.646.647a.5.5 0 0 0 .708 0l1-1a.5.5 0 0 0 0-.708z"/>
                    <path d="M1 7a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h4.5a.5.5 0 0 0 0-1H1V8h4.5a.5.5 0 0 0 0-1zm9.5 0a.5.5 0 0 0 0 1H15v2h-4.5a.5.5 0 0 0 0 1H15a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/>
                </svg>
            </button>
            <div class="rail-divider"></div>
            <button class="rail-btn" id="changesHistoryBtn" title="Changes">
                <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2"/>
                </svg>
            </button>
            <form action="https://github.com/iamrasel/marswatch" target="_blank" style="display:inline;">
                <button class="rail-btn" title="Star this project on GitHub">
                    <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                    </svg>
                </button>
            </form>
        </div>
    </aside>

    <div class="modal-overlay" id="marsModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle"></span>
                <button class="modal-close" id="modalCloseBtn" title="Close">&times;</button>
            </div>
            <div class="modal-search-wrap" id="modalSearchWrap">
                <input class="modal-search" id="modalSearch" type="text" placeholder="Type to filter..." autofocus />
                <span class="modal-count" id="modalCount">0</span>
            </div>
            <div class="modal-list" id="modalList"></div>
            <div class="modal-empty-info" id="modalEmptyInfo"></div>
        </div>
    </div>

    <div id="mars-toast"></div>

    <script src="script.js"></script>
</body>

</html>
